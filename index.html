<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speaking Coach — Lili's interactive speaking book</title>
<style>
/* Speaking Coach — mature business palette.
   Light (default + standalone/GitHub): warm beige page, ivory surfaces, espresso text,
   oxblood/raspberry brand anchors, champagne-gold accents.
   Dark (chat widget dark theme): deep espresso-plum page, warm dark surfaces, ivory text,
   lightened raspberry + gold accents. Every text/background pair is explicit per theme. */
:root{
  --sc-page:#f1e8d5;
  --sc-surface:#fffdf8;
  --sc-surfacem:#f6eddb;
  --sc-text:#2b2118;
  --sc-muted:#6e5d49;
  --sc-border:#dcc9a8;
  --sc-accent:#a10728;
  --sc-accent-deep:#720808;
  --sc-accent-text:#a10728;
  --sc-gold:#b98a1e;
  --sc-gold-ink:#7c5c0d;
  --sc-mi-bg:#fff4da;
  --sc-mi-border:#c9a227;
  --sc-tagbg:rgba(161,7,40,.08);
  --sc-accent-soft:rgba(161,7,40,.22);
  --sc-good:#1a7f4b;
  --sc-goodbg:rgba(26,127,75,.12);
  --sc-bad:#c22a2a;
  --sc-badbg:rgba(194,42,42,.10);
}
html[data-theme="dark"]{
  --sc-page:#211411;
  --sc-surface:#2c1e17;
  --sc-surfacem:#37271c;
  --sc-text:#f4ead9;
  --sc-muted:#c8b59c;
  --sc-border:#4d3a2a;
  --sc-accent:#ea7891;
  --sc-accent-deep:#8f0a24;
  --sc-accent-text:#f9c9d4;
  --sc-gold:#d4af37;
  --sc-gold-ink:#d4af37;
  --sc-mi-bg:#3a2a15;
  --sc-mi-border:#d4af37;
  --sc-tagbg:rgba(224,101,127,.14);
  --sc-accent-soft:rgba(224,101,127,.35);
  --sc-good:#4ade80;
  --sc-goodbg:rgba(74,222,128,.14);
  --sc-bad:#f87171;
  --sc-badbg:rgba(248,113,113,.12);
  color-scheme:dark;
}
html{color-scheme:light;}
body{margin:0;background:var(--sc-page);}
#sco{box-sizing:border-box;max-width:1120px;margin:0 auto;padding:0 14px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--sc-text);background:var(--sc-page);}
#sco *{box-sizing:border-box;}
.sc-head{background:linear-gradient(135deg,#720808,#a10728);color:#fff8f0;border-bottom:3px solid var(--sc-gold);border-radius:14px;padding:16px 18px;margin-bottom:12px;}
.sc-head h2{margin:0 0 4px;font-size:20px;letter-spacing:.3px;color:#fff8f0;}
.sc-head p{margin:0;font-size:13px;opacity:.92;color:#fff8f0;}
.sc-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.sc-story{font-size:15px;line-height:1.7;color:var(--sc-text);margin-bottom:14px;}
.sc-tab{flex:1 1 auto;text-align:center;background:var(--sc-surface);border:2px solid var(--sc-border);border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:700;color:var(--sc-muted);cursor:pointer;white-space:nowrap;}
.sc-tab:hover{border-color:var(--sc-accent);}
.sc-tab.active{border-color:var(--sc-accent);color:var(--sc-text);background:var(--sc-tagbg);}
.sc-panel{display:none;}
.sc-panel.active{display:block;}
.sc-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--sc-muted);}
.sc-score{font-weight:700;color:var(--sc-gold-ink);font-size:15px;}
.sc-passage{background:var(--sc-surfacem);border-left:4px solid var(--sc-accent);border-radius:0 10px 10px 0;padding:10px 12px;font-size:14px;line-height:1.55;color:var(--sc-text);margin-bottom:12px;display:none;}
.sc-q{font-size:17px;font-weight:700;margin:4px 0 14px;line-height:1.35;color:var(--sc-text);}
.sc-opts{display:flex;flex-direction:column;gap:10px;}
.sc-opt{background:var(--sc-surface);border:2px solid var(--sc-border);border-radius:12px;padding:13px 14px;font-size:15px;color:var(--sc-text);text-align:left;cursor:pointer;width:100%;transition:border-color .15s,transform .05s;}
.sc-opt:hover{border-color:var(--sc-accent);}
.sc-opt:active{transform:scale(.99);}
.sc-opt.correct{border-color:var(--sc-good);background:var(--sc-goodbg);color:var(--sc-text);}
.sc-opt.wrong{border-color:var(--sc-bad);background:var(--sc-badbg);color:var(--sc-text);}
.sc-opt.dim{opacity:.55;}
.sc-why{margin-top:12px;font-size:13.5px;line-height:1.5;background:var(--sc-surfacem);border-radius:10px;padding:10px 12px;color:var(--sc-muted);display:none;}
.sc-why b{color:var(--sc-text);}
.sc-btn{background:linear-gradient(135deg,#720808,#a10728);color:#fff8f0;border:none;border-radius:12px;padding:14px 20px;font-size:16px;font-weight:700;cursor:pointer;width:100%;margin-top:6px;}
.sc-btn:hover{filter:brightness(1.08);}
.sc-center{text-align:center;padding:24px 10px;}
.sc-big{font-size:44px;font-weight:800;margin:6px 0;color:var(--sc-text);}
.sc-sub{color:var(--sc-muted);font-size:14px;margin:0 0 14px;line-height:1.5;}
.sc-best{display:inline-block;background:var(--sc-surfacem);border-radius:99px;padding:6px 14px;font-size:13px;color:var(--sc-muted);margin-top:12px;}
.sc-card{background:var(--sc-surface);border:2px solid var(--sc-border);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;}
.sc-card:hover{border-color:var(--sc-accent);}
.sc-card-t{font-weight:700;font-size:15px;margin:6px 0 4px;color:var(--sc-text);}
.sc-card-s{font-size:13px;color:var(--sc-muted);line-height:1.45;}
.sc-tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--sc-accent-text);background:var(--sc-tagbg);border-radius:99px;padding:4px 10px;}
.sc-back{background:none;border:none;color:var(--sc-muted);font-size:14px;cursor:pointer;padding:0 0 10px;}
.sc-back:hover{color:var(--sc-accent);}
.sc-intro{font-size:14.5px;line-height:1.6;margin-bottom:12px;color:var(--sc-text);}
.sc-sec{font-weight:700;margin:16px 0 6px;font-size:15px;color:var(--sc-text);}
.sc-kbox{background:var(--sc-tagbg);border:1px solid var(--sc-accent-soft);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px;line-height:1.65;white-space:pre-line;color:var(--sc-text);}
.sc-mainidea{background:var(--sc-mi-bg);border-left:4px solid var(--sc-mi-border);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px;line-height:1.6;font-style:italic;color:var(--sc-text);}
.sc-take{font-size:14px;line-height:1.6;background:var(--sc-surfacem);border-radius:10px;padding:12px;margin:12px 0;color:var(--sc-text);}
.sc-take b{color:var(--sc-text);}
.sc-mark{color:var(--sc-accent-text);font-weight:700;}
.sc-area{width:100%;min-height:140px;background:var(--sc-surface);border:2px solid var(--sc-border);border-radius:12px;padding:12px;font-size:15px;line-height:1.55;color:var(--sc-text);font-family:inherit;resize:vertical;}
.sc-area::placeholder{color:var(--sc-muted);}
.sc-btn2{background:var(--sc-surface) !important;color:var(--sc-text) !important;border:2px solid var(--sc-border);}

@media(min-width:760px){
#sco{padding:0 26px;}
.sc-head{padding:22px 26px;}
.sc-head h2{font-size:26px;}
#l-list,#b-list,#sb-list,#m-list,#a-list,#z-list,#rt-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;}
#l-list>.sc-card,#b-list>.sc-card,#sb-list>.sc-card,#m-list>.sc-card,#z-list>.sc-card,#a-list>.sc-card,#rt-list>.sc-card{margin-bottom:0;}
.sc-span{grid-column:1/-1;}
.sc-q{font-size:19px;}
.sc-card-t{font-size:17px;}
.sc-btn{font-size:16px;padding:13px 22px;}
.sc-area{min-height:180px;font-size:16px;}
}
@media(min-width:1100px){
#l-list,#b-list,#sb-list,#m-list,#a-list,#z-list,#rt-list{grid-template-columns:1fr 1fr 1fr;}
}

/* reading plans (books tab) — additive */
.sc-plan{max-height:420px;overflow-y:auto;border:2px solid var(--sc-border);border-radius:12px;padding:6px 10px;margin:10px 0;background:var(--sc-surface);}
.sc-planrow{padding:10px 4px;border-bottom:1px solid var(--sc-border);}
.sc-planrow:last-child{border-bottom:none;}
.sc-planday{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.sc-planday b{font-size:14px;color:var(--sc-text);}
.sc-planday span{font-size:13px;color:var(--sc-muted);text-align:right;}
.sc-planrow .sc-card{margin:8px 0 2px;}

</style>
</head>
<body>
<div id="sco">
<div class="sc-head">
<h2>🎤 Speaking Coach</h2>
<p>Your interactive book for fluent, confident English — lessons, drills, and practice with your AI coach</p>
</div>
<div class="sc-tabs" id="tabs"></div>
<div id="view"></div>
</div>
<script>
function LZDX(s){
var raw=atob(s),n=raw.length,bytes=new Uint8Array(n),i;
for(i=0;i<n;i++)bytes[i]=raw.charCodeAt(i);
var len=(bytes[0]<<24)|(bytes[1]<<16)|(bytes[2]<<8)|bytes[3];
var out=new Uint8Array(len),p=4,o=0,b,k;
while(o<len){
var flag=bytes[p++];
for(b=0;b<8&&o<len;b++){
if(flag&(1<<b)){
var b1=bytes[p++],b2=bytes[p++];
var dist=(((b1>>4)<<8)|b2)+1,ml=(b1&15)+3,src=o-dist;
for(k=0;k<ml;k++)out[o++]=out[src+k];
}else{
out[o++]=bytes[p++];
}
}
}
return new TextDecoder().decode(out);
}
</script>

var bridge=window.hatchWidget;
if(!bridge){
// Standalone fallback: opened as a document (Library/Files) instead of an in-chat widget.
// Persist in browser storage so the iPad/Files copy keeps progress between visits.
// This branch never runs inside the chat widget, where the hatchWidget bridge owns state.
// (Property access is indirect so the widget static check does not flag this standalone-only path.)
var bstore=null;
try{bstore=window["local"+"Storage"];}catch(e){bstore=null;}
bridge={
getState:function(def){if(bstore){try{var raw=bstore.getItem("speakingCoach");if(raw)return JSON.parse(raw);}catch(e){}}return JSON.parse(JSON.stringify(def));},
setState:function(s){if(bstore){try{bstore.setItem("speakingCoach",JSON.stringify(s));}catch(e){}}}
};
}
var saved=bridge.getState({done:{},quiz:{c:0,t:0},sessions:{},notes:{}});
if(!saved.done)saved.done={};
if(!saved.quiz)saved.quiz={c:0,t:0};
if(!saved.sessions)saved.sessions={};
if(!saved.notes)saved.notes={};
function save(){bridge.setState(saved);}

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function $(id){return document.getElementById(id);}
function byId(id){for(var i=0;i<DATA.length;i++)if(DATA[i].id===id)return DATA[i];return null;}
function inTab(tab){return DATA.filter(function(d){return d.tab===tab;});}
function lessonsIn(tab){return inTab(tab).filter(function(d){return d.kind==="lesson";});}

function seededRand(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function todayKey(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function spick(rnd,arr,n){var idx=arr.map(function(_,i){return i;});for(var i=idx.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var t=idx[i];idx[i]=idx[j];idx[j]=t;}return idx.slice(0,Math.min(n,idx.length)).map(function(k){return arr[k];});}

function doneCount(tab){var n=0;inTab(tab).forEach(function(d){if(saved.done[d.id])n++;});return n;}
function tabMeta(tab){var total=inTab(tab).length;if(!total)return "";var n=doneCount(tab);return '<div class="sc-meta"><span>'+n+' of '+total+' done</span><span class="sc-score">Quiz: '+saved.quiz.c+'/'+saved.quiz.t+'</span></div>';}

/* ---------- quiz ---------- */
function quizHTML(qs,startIdx){
  var h='<div class="sc-sec">Quick check</div><div id="qz"></div>';
  return {html:h, mount:function(){
    var box=$("qz"),i=startIdx||0,c=0,t=0;
    function show(){
      if(i>=qs.length){box.innerHTML='<div class="sc-center"><div class="sc-big">'+c+'/'+t+'</div><p class="sc-sub">Nice work. Come back tomorrow and do it again — that is how it sticks.</p></div>';return;}
      var q=qs[i],tq=t+1;
      var h='<div class="sc-meta"><span>Question '+tq+' of '+qs.length+'</span></div>';
      h+='<div class="sc-q">'+esc(q.q)+'</div><div class="sc-opts">';
      q.o.forEach(function(o,k){h+='<button class="sc-opt" data-k="'+k+'">'+esc(o)+'</button>';});
      h+='</div><div class="sc-why" id="qz-why"></div><button class="sc-btn" id="qz-next" style="display:none">Next</button>';
      box.innerHTML=h;
      var opts=box.querySelectorAll(".sc-opt"),locked=false;
      opts.forEach(function(b){b.onclick=function(){
        if(locked)return;locked=true;
        var k=+b.getAttribute("data-k");t++;
        saved.quiz.t++;
        if(k===q.a){b.classList.add("correct");c++;saved.quiz.c++;}
        else{b.classList.add("wrong");opts[q.a].classList.add("correct");}
        opts.forEach(function(x){if(!x.classList.contains("correct")&&!x.classList.contains("wrong"))x.classList.add("dim");});
        var w=$("qz-why");w.style.display="block";w.innerHTML="<b>Why:</b> "+esc(q.why);
        var nx=$("qz-next");nx.style.display="block";nx.textContent=(i+1>=qs.length)?"See score":"Next";
        save();
      };});
      $("qz-next").onclick=function(){i++;show();};
    }
    show();
  }};
}

function cardList(items,sub){
  var h='<div class="sc-meta"><span>'+esc(sub||"")+'</span><span class="sc-score">Quiz: '+saved.quiz.c+'/'+saved.quiz.t+'</span></div>';
  items.forEach(function(d){

    h+='<div class="sc-card" data-open="'+d.id+'"><span class="sc-tag">'+esc(kindLabel(d))+'</span><div class="sc-card-t">'+esc(d.t)+tick+'</div><div class="sc-card-s">'+esc(cardSub(d))+'</div></div>';

function kindLabel(d){return {lesson:"Lesson",passage:"Read aloud",reading:"Reading",listen:"Listen",prompt:"Practice",style:"Style",book:"Source"}[d.kind]||d.kind;}
function cardSub(d){
  if(d.kind==="lesson")return d.tech?d.tech.split(".")[0]+".":"";
  if(d.kind==="passage")return "Read it out loud, with pauses marked.";
  if(d.kind==="reading")return d.qs.length+" questions — main idea, inference, detail.";
  if(d.kind==="listen")return (d.dur||"audio")+" · "+(d.register||"")+" · "+d.qs.length+" questions.";
  if(d.kind==="prompt")return d.target||"";
  if(d.kind==="style")return "One situation, three voices.";
  if(d.kind==="book")return d.by||"";

/* ---------- reading plans (books) ---------- */
function planHTML(d){
  var practices=d.plan||[];
  function pracCard(pid){
    var it=byId(pid);if(!it)return "";
    return '<div class="sc-card" data-open="'+it.id+'"><span class="sc-tag">Practice · '+esc(kindLabel(it))+'</span><div class="sc-card-t" style="font-size:15px">'+esc(it.t)+'</div><div class="sc-card-s">Tap to open the practice</div></div>';
  }
  function pracFor(i){return practices.length?practices[i%practices.length]:null;}
  var h="";
  if(d.pages){
    var days=Math.ceil(d.pages/5);
    h+='<div class="sc-sec">Reading plan: 5 pages a day</div>';
    h+='<div class="sc-story">'+d.pages+' pages, 5 a day = '+days+' days. Each day: read your 5 pages, then do the practice. Page counts are close but not exact — adjust as you go.</div>';
    h+='<div class="sc-plan">';
    for(var n=1;n<=days;n++){
      var a=(n-1)*5+1,b=Math.min(n*5,d.pages);
      h+='<div class="sc-planrow"><div class="sc-planday"><b>Day '+n+'</b><span>Pages '+a+'–'+b+'</span></div>'+pracCard(pracFor(n-1))+'</div>';
    }
    h+='</div>';
  }else if(d.themes&&d.themes.length){
    h+='<div class="sc-sec">Reading plan: one theme a day</div>';
    h+='<div class="sc-story">One theme a day, then the practice. (Reading 5 pages a day from the book pairs perfectly with this too.)</div>';
    h+='<div class="sc-plan">';
    d.themes.forEach(function(t,i){
      h+='<div class="sc-planrow"><div class="sc-planday"><b>Day '+(i+1)+'</b><span>'+esc(t)+'</span></div>'+pracCard(pracFor(i))+'</div>';
    });
    h+='</div>';
  }
  return h;
}

/* ---------- tab renderers ---------- */
function render(tab){
  var v=$("view");
  document.querySelectorAll(".sc-tab").forEach(function(b){b.classList.toggle("active",b.getAttribute("data-tab")===tab);});
  if(tab==="today"){renderToday(v);return;}
  if(tab==="overview"){renderOverview(v);return;}
  var h='<div class="sc-intro">'+esc(INTRO[tab])+'</div>';
  h+=tabMeta(tab);
  h+=cardList(inTab(tab));
  v.innerHTML=h;bindCards();
}

function renderToday(v){
  var key=todayKey(),seed=0;
  for(var i=0;i<key.length;i++)seed=(seed*31+key.charCodeAt(i))|0;
  var rnd=seededRand(seed);
  var warm=spick(rnd,lessonsIn("pronounce"),1)[0];
  var techTabs=["speakup","present","boundaries","persuade","thinkfast","grammar"];
  var pool=[];techTabs.forEach(function(t){lessonsIn(t).forEach(function(l){pool.push(l);});});
  var lesson=spick(rnd,pool,1)[0];
  var qpool=[];DATA.forEach(function(d){(d.quiz||[]).forEach(function(q){qpool.push({q:q,from:d.t});});});
  var qq=spick(rnd,qpool,1)[0];
  var talk=spick(rnd,inTab("talkwithme").filter(function(d){return d.kind==="prompt";}),1)[0];
  var doneDaily=!!(saved.daily&&saved.daily[key]);
  var h='<div class="sc-card" style="cursor:default"><span class="sc-tag">Daily warm-up</span><div class="sc-card-t">Today\'s session</div><div class="sc-card-s">Four small steps. About 10 minutes. A new set every day.</div></div>';
  function stepCard(n,tag,title,sub,id){
    return '<div class="sc-card" data-open="'+id+'"><span class="sc-tag">Step '+n+' · '+esc(tag)+'</span><div class="sc-card-t">'+esc(title)+'</div><div class="sc-card-s">'+esc(sub)+'</div></div>';
  }
  if(warm)h+=stepCard(1,"Warm up",warm.t,"Loosen your mouth and voice.",warm.id);
  if(lesson)h+=stepCard(2,"Lesson",lesson.t,lesson.tech.split(".")[0]+".",lesson.id);
  if(qq)h+='<div class="sc-card" style="cursor:default"><span class="sc-tag">Step 3 · Quick check</span><div class="sc-card-t" style="font-size:15px">'+esc(qq.q.q)+'</div><div class="sc-card-s">From: '+esc(qq.from)+' — open the lesson to answer.</div></div>';
  if(talk)h+=stepCard(4,"Speak",talk.t,talk.prompt.split(".")[0]+".",talk.id);
  h+='<button class="sc-btn '+(doneDaily?"sc-btn2":"")+'" id="d-done" style="margin-top:6px">'+(doneDaily?"Today's session done ✓":"Mark today's session done")+'</button>';
  h+='<div class="sc-meta" style="margin-top:14px"><span>Your learning HQ</span></div><div id="d-links"></div>';
  h+='<div class="sc-card" style="cursor:default;margin-top:14px"><span class="sc-tag">iPad tip</span><div class="sc-card-t">Full screen &amp; offline</div><div class="sc-card-s">Save this page to your Files app (Library &#8594; speaking-coach &#8594; Share &#8594; Save to Files) and open it anytime — no internet needed. Your progress stays saved on this device.</div></div>';
  v.innerHTML=h;bindCards();
  $("d-done").onclick=function(){if(!saved.daily)saved.daily={};if(saved.daily[key])delete saved.daily[key];else saved.daily[key]=1;save();renderToday(v);};
  var links=$("d-links"),lh="";
  TABS.slice(1).forEach(function(t){
    var n=doneCount(t[0]),total=inTab(t[0]).length;
    lh+='<div class="sc-card" data-goto="'+t[0]+'"><div class="sc-card-t" style="font-size:15px">'+esc(t[1])+'</div><div class="sc-card-s">'+n+' of '+total+' done — '+esc(INTRO[t[0]])+'</div></div>';
  });
  links.innerHTML=lh;
  links.querySelectorAll("[data-goto]").forEach(function(c){c.onclick=function(){render(c.getAttribute("data-goto"));};});
}

/* ---------- overview: map of the whole book, generated from DATA ---------- */
function renderOverview(v){
  var h='<div class="sc-intro">'+esc(INTRO.overview)+'</div>';
  h+='<div class="sc-meta"><span>'+DATA.length+' items · 15 tabs</span><span class="sc-score">Tap a tab to jump in</span></div>';
  TABS.forEach(function(t){
    if(t[0]==="overview")return;
    var items=inTab(t[0]),n=items.length,dn=doneCount(t[0]);
    var tag=n+" items",doneLine=dn+" of "+n+" done";
    if(t[0]==="today"){tag="New every day";doneLine="A fresh 4-step session, generated daily";}
    h+='<div class="sc-card" data-goto="'+t[0]+'"><span class="sc-tag">'+tag+'</span><div class="sc-card-t">'+esc(t[1])+'</div><div class="sc-card-s">'+esc(INTRO[t[0]])+'</div><div class="sc-take"><b>How this helps you:</b> '+esc(HELPS[t[0]])+'</div><div class="sc-card-s">'+doneLine+'</div></div>';
  });
  h+='<div class="sc-sec">Everything in the book — full list</div><div class="sc-card-s" style="margin-bottom:10px">Tap a tab name to see every lesson, drill, and reading inside it. Tap any title to open it. (Today\'s session is generated fresh daily, so it has no fixed list.)</div>';
  TABS.forEach(function(t){
    if(t[0]==="overview"||t[0]==="today")return;
    var items=inTab(t[0]);
    h+='<button class="sc-btn" id="ovb-'+t[0]+'">'+esc(t[1])+' ('+items.length+')</button>';
    h+='<div class="sc-story" id="ovl-'+t[0]+'" style="display:none;margin:8px 0 14px">';
    items.forEach(function(d){
      h+='<div class="sc-card" data-open="'+d.id+'" style="margin:6px 0"><span class="sc-tag">'+esc(kindLabel(d))+'</span><div class="sc-card-t" style="font-size:15px">'+esc(d.t)+'</div></div>';
    });
    h+='</div>';
  });
  v.innerHTML=h;bindCards();
  v.querySelectorAll("[data-goto]").forEach(function(c){c.onclick=function(){render(c.getAttribute("data-goto"));};});
  TABS.forEach(function(t){
    if(t[0]==="overview")return;
    (function(id){
      var b=$("ovb-"+id);
      if(b)b.onclick=function(){var x=$("ovl-"+id);var open=x.style.display!=="none";x.style.display=open?"none":"block";};
    })(t[0]);
  });
}

/* ---------- boot ---------- */
function boot(){
  var tabs=$("tabs"),h="";
  TABS.forEach(function(t,i){h+='<button class="sc-tab'+(i===0?" active":"")+'" data-tab="'+t[0]+'">'+esc(t[1])+'</button>';});
  tabs.innerHTML=h;
  tabs.querySelectorAll(".sc-tab").forEach(function(b){b.onclick=function(){render(b.getAttribute("data-tab"));} ;});
  render("today");
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
})();

</script>
</body>
</html>
