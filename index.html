<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speaking Coach — Lili's interactive speaking book</title>
<style>

html{color-scheme:light;}
body{margin:0;background:#fff8f2;}
#sco{box-sizing:border-box;max-width:1120px;margin:0 auto;padding:0 14px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--hatch-widget-text,#2b2118);}
#sco *{box-sizing:border-box;}
.sc-head{background:linear-gradient(135deg,#720808,#a10728);color:#fff;border-radius:14px;padding:16px 18px;margin-bottom:12px;}
.sc-head h2{margin:0 0 4px;font-size:20px;letter-spacing:.3px;}
.sc-head p{margin:0;font-size:13px;opacity:.92;}
.sc-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.sc-story{font-size:15px;line-height:1.7;color:var(--hatch-widget-text,#2b2118);margin-bottom:14px;}
.sc-tab{flex:1 1 auto;text-align:center;background:var(--hatch-widget-surface,#ffffff);border:2px solid var(--hatch-widget-border,#e8d9cf);border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:700;color:var(--hatch-widget-muted,#7a6a5c);cursor:pointer;white-space:nowrap;}
.sc-tab.active{border-color:#a10728;color:var(--hatch-widget-text,#2b2118);background:rgba(161,7,40,.08);}
.sc-panel{display:none;}
.sc-panel.active{display:block;}
.sc-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--hatch-widget-muted,#7a6a5c);}
.sc-score{font-weight:700;color:var(--hatch-widget-text,#2b2118);font-size:15px;}
.sc-passage{background:var(--hatch-widget-surface-muted,#f6f0ea);border-left:4px solid #a10728;border-radius:0 10px 10px 0;padding:10px 12px;font-size:14px;line-height:1.55;color:var(--hatch-widget-text,#2b2118);margin-bottom:12px;display:none;}
.sc-q{font-size:17px;font-weight:700;margin:4px 0 14px;line-height:1.35;}
.sc-opts{display:flex;flex-direction:column;gap:10px;}
.sc-opt{background:var(--hatch-widget-surface,#ffffff);border:2px solid var(--hatch-widget-border,#e8d9cf);border-radius:12px;padding:13px 14px;font-size:15px;color:var(--hatch-widget-text,#2b2118);text-align:left;cursor:pointer;width:100%;transition:border-color .15s,transform .05s;}
.sc-opt:active{transform:scale(.99);}
.sc-opt.correct{border-color:#16a34a;background:rgba(22,163,74,.12);}
.sc-opt.wrong{border-color:#dc2626;background:rgba(220,38,38,.10);}
.sc-opt.dim{opacity:.55;}
.sc-why{margin-top:12px;font-size:13.5px;line-height:1.5;background:var(--hatch-widget-surface-muted,#f6f0ea);border-radius:10px;padding:10px 12px;color:var(--hatch-widget-muted,#7a6a5c);display:none;}
.sc-why b{color:var(--hatch-widget-text,#2b2118);}
.sc-btn{background:linear-gradient(135deg,#720808,#a10728);color:#fff;border:none;border-radius:12px;padding:14px 20px;font-size:16px;font-weight:700;cursor:pointer;width:100%;margin-top:6px;}
.sc-center{text-align:center;padding:24px 10px;}
.sc-big{font-size:44px;font-weight:800;margin:6px 0;}
.sc-sub{color:var(--hatch-widget-muted,#7a6a5c);font-size:14px;margin:0 0 14px;line-height:1.5;}
.sc-best{display:inline-block;background:var(--hatch-widget-surface-muted,#f6f0ea);border-radius:99px;padding:6px 14px;font-size:13px;color:var(--hatch-widget-muted,#7a6a5c);margin-top:12px;}
.sc-card{background:var(--hatch-widget-surface,#ffffff);border:2px solid var(--hatch-widget-border,#e8d9cf);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;}
.sc-card-t{font-weight:700;font-size:15px;margin:6px 0 4px;}
.sc-card-s{font-size:13px;color:var(--hatch-widget-muted,#7a6a5c);line-height:1.45;}
.sc-tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#a10728;background:rgba(161,7,40,.10);border-radius:99px;padding:4px 10px;}
.sc-back{background:none;border:none;color:var(--hatch-widget-muted,#7a6a5c);font-size:14px;cursor:pointer;padding:0 0 10px;}
.sc-intro{font-size:14.5px;line-height:1.6;margin-bottom:12px;color:var(--hatch-widget-text,#2b2118);}
.sc-sec{font-weight:700;margin:16px 0 6px;font-size:15px;color:var(--hatch-widget-text,#2b2118);}
.sc-kbox{background:rgba(161,7,40,.05);border:1px solid rgba(161,7,40,.18);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px;line-height:1.65;white-space:pre-line;}.sc-mainidea{background:#fff7e6;border-left:4px solid #e8a13c;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px;line-height:1.6;font-style:italic;}
.sc-take{font-size:14px;line-height:1.6;background:var(--hatch-widget-surface-muted,#f6f0ea);border-radius:10px;padding:12px;margin:12px 0;}
.sc-take b{color:var(--hatch-widget-text,#2b2118);}
.sc-area{width:100%;min-height:140px;background:var(--hatch-widget-surface,#ffffff);border:2px solid var(--hatch-widget-border,#e8d9cf);border-radius:12px;padding:12px;font-size:15px;line-height:1.55;color:var(--hatch-widget-text,#2b2118);font-family:inherit;resize:vertical;}
.sc-btn2{background:var(--hatch-widget-surface,#ffffff) !important;color:var(--hatch-widget-text,#2b2118) !important;border:2px solid var(--hatch-widget-border,#e8d9cf);}

@media(min-width:760px){
#sco{padding:0 26px;}
.sc-head{padding:22px 26px;}
.sc-head h2{font-size:26px;}
#l-list,#b-list,#sb-list,#m-list,#a-list,#z-list,#rt-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;}
#l-list>.sc-card,#b-list>.sc-card,#sb-list>.sc-card,#m-list>.sc-card,#a-list>.sc-card,#z-list>.sc-card{margin-bottom:0;}
.sc-span{grid-column:1/-1;}
.sc-q{font-size:19px;}
.sc-card-t{font-size:17px;}
.sc-btn{font-size:16px;padding:13px 22px;}
.sc-area{min-height:180px;font-size:16px;}
}
@media(min-width:1100px){
#l-list,#b-list,#sb-list,#m-list,#a-list,#z-list,#rt-list{grid-template-columns:1fr 1fr 1fr;}
}

/* reading plans (books tab) — new, additive */
.sc-plan{max-height:420px;overflow-y:auto;border:2px solid var(--hatch-widget-border,#e8d9cf);border-radius:12px;padding:6px 10px;margin:10px 0;background:var(--hatch-widget-surface,#ffffff);}
.sc-planrow{padding:10px 4px;border-bottom:1px solid var(--hatch-widget-border,#e8d9cf);}
.sc-planrow:last-child{border-bottom:none;}
.sc-planday{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.sc-planday b{font-size:14px;}
.sc-planday span{font-size:13px;color:var(--hatch-widget-muted,#7a6a5c);text-align:right;}
.sc-planrow .sc-card{margin:8px 0 2px;}

</style>
</head>
<body>
<div id="sco">
<div class="sc-head">
<h2>🎤 Speaking Coach</h2>
<p>Your interactive book for fluent, confident English — lessons, drills, and practice with your AI coach</p>
</div>
<div class="sc-tabs" id="tabs"></div>
<div id="view"></div>
</div>
<script>
function LZDX(s){
var raw=atob(s),n=raw.length,bytes=new Uint8Array(n),i;
for(i=0;i<n;i++)bytes[i]=raw.charCodeAt(i);
var len=(bytes[0]<<24)|(bytes[1]<<16)|(bytes[2]<<8)|bytes[3];
var out=new Uint8Array(len),p=4,o=0,b,k;
while(o<len){
var flag=bytes[p++];
for(b=0;b<8&&o<len;b++){
if(flag&(1<<b)){
var b1=bytes[p++],b2=bytes[p++];
var dist=(((b1>>4)<<8)|b2)+1,ml=(b1&15)+3,src=o-dist;
for(k=0;k<ml;k++)out[o++]=out[src+k];
}else{
out[o++]=bytes[p++];
}
}
}
return new TextDecoder().decode(out);
}
</script>

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function $(id){return document.getElementById(id);}
function byId(id){for(var i=0;i<DATA.length;i++)if(DATA[i].id===id)return DATA[i];return null;}

function quizHTML(qs,startIdx){

  return {html:h,mount:function(){
    qz.mount();
    $("done-btn").onclick=function(){if(saved.done[d.id])delete saved.done[d.id];else saved.done[d.id]=1;save();render(d.tab);};
    bindBack();
  }};
}

function bindBack(){
  document.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){render(b.getAttribute("data-go"));};});
}

function cardList(items,sub){
  var h='<div class="sc-meta"><span>'+esc(sub||"")+'</span><span class="sc-score">Quiz: '+saved.quiz.c+'/'+saved.quiz.t+'</span></div>';
  items.forEach(function(d){
    var tick=saved.done[d.id]?" ✓":"";
    h+='<div class="sc-card" data-open="'+d.id+'"><span class="sc-tag">'+esc(kindLabel(d))+'</span><div class="sc-card-t">'+esc(d.t)+tick+'</div><div class="sc-card-s">'+esc(cardSub(d))+'</div></div>';
  });
  return h;
}
function kindLabel(d){return {lesson:"Lesson",passage:"Read aloud",reading:"Reading",prompt:"Practice",style:"Style",book:"Source"}[d.kind]||d.kind;}
function cardSub(d){
  if(d.kind==="lesson")return d.tech?d.tech.split(".")[0]+".":"";
  if(d.kind==="passage")return "Read it out loud, with pauses marked.";
  if(d.kind==="reading")return d.qs.length+" questions — main idea, inference, detail.";
  if(d.kind==="prompt")return d.target||"";
  if(d.kind==="style")return "One situation, three voices.";
  if(d.kind==="book")return d.by||"";
  return "";
}
function bindCards(){
  document.querySelectorAll("[data-open]").forEach(function(c){c.onclick=function(){openItem(c.getAttribute("data-open"));};});
}

/* ---------- item openers ---------- */
function openItem(id){
  var d=byId(id),v=$("view");if(!d)return;
  if(d.kind==="lesson"){var L=lessonHTML(d);v.innerHTML=L.html;L.mount();bindCards();return;}
  if(d.kind==="passage"){
    var h='<button class="sc-back" data-go="readaloud">&larr; Back to Read Aloud</button>';
    h+='<span class="sc-tag">Read aloud</span><div class="sc-card-t" style="font-size:19px;margin:8px 0">'+esc(d.t)+'</div>';
    var txt=esc(d.text).replace(/\[pause\]/g,'<b style="color:#a10728">[pause]</b>').replace(/\[breathe\]/g,'<b style="color:#a10728">[breathe]</b>');
    h+='<div class="sc-passage" style="display:block">'+txt+'</div>';
    h+='<div class="sc-sec">How to read it</div><div class="sc-story">'+esc(d.tips)+'</div>';
    h+='<div class="sc-sec">Check yourself</div><div class="sc-kbox">'+d.check.map(function(c){return "☐ "+esc(c);}).join("\n")+'</div>';
    var done=!!saved.done[d.id];
    h+='<button class="sc-btn '+(done?"sc-btn2":"")+'" id="done-btn" style="margin-top:14px">'+(done?"Done ✓ — tap to undo":"Mark done")+'</button>';
    v.innerHTML=h;
    $("done-btn").onclick=function(){if(saved.done[d.id])delete saved.done[d.id];else saved.done[d.id]=1;save();openItem(id);};
    bindBack();return;
  }
  if(d.kind==="reading"){
    var h2='<button class="sc-back" data-go="comprehend">&larr; Back to Comprehend</button>';
    h2+='<span class="sc-tag">Reading</span><div class="sc-card-t" style="font-size:19px;margin:8px 0">'+esc(d.t)+'</div>';
    h2+='<div class="sc-passage" style="display:block">'+esc(d.text)+'</div>';
    var qz2=quizHTML(d.qs||[]);h2+=qz2.html;
    var done2=!!saved.done[d.id];
    h2+='<button class="sc-btn '+(done2?"sc-btn2":"")+'" id="done-btn" style="margin-top:14px">'+(done2?"Done ✓ — tap to undo":"Mark done")+'</button>';
    v.innerHTML=h2;qz2.mount();
    $("done-btn").onclick=function(){if(saved.done[d.id])delete saved.done[d.id];else saved.done[d.id]=1;save();openItem(id);};
    bindBack();return;
  }
  if(d.kind==="prompt"){
    var backTab=d.tab;
    var h3='<button class="sc-back" data-go="'+backTab+'">&larr; Back to '+esc(TABNAME[backTab])+'</button>';
    h3+='<span class="sc-tag">'+esc(TABNAME[backTab])+'</span><div class="sc-card-t" style="font-size:19px;margin:8px 0">'+esc(d.t)+'</div>';
    h3+='<div class="sc-sec">Your prompt</div><div class="sc-mainidea" style="font-style:normal">'+esc(d.prompt)+'</div>';
    h3+='<div class="sc-card-s" style="margin:8px 0">'+esc(d.target||"")+'</div>';
    h3+='<div class="sc-sec">Feedback checklist</div><div class="sc-kbox">'+d.feedback.map(function(f){return "☐ "+esc(f);}).join("\n")+'</div>';
    if(backTab==="talkwithme"){
      h3+='<div class="sc-sec">Log your session</div><textarea class="sc-area" id="sess-note" placeholder="What did you talk about? What went well? What will you improve?"></textarea>';
      h3+='<button class="sc-btn" id="sess-save" style="margin-top:8px">Save session note</button>';
      var sess=saved.sessions[d.id]||[];
      if(sess.length){h3+='<div class="sc-sec">Past sessions</div>';sess.slice().reverse().forEach(function(s){h3+='<div class="sc-take"><b>'+esc(s.d)+'</b><br>'+esc(s.n)+'</div>';});}
    }else{
      var note=saved.notes[d.id]||"";
      h3+='<div class="sc-sec">Your writing space</div><textarea class="sc-area" id="w-note">'+esc(note)+'</textarea>';
      h3+='<button class="sc-btn" id="w-save" style="margin-top:8px">Save my writing</button><div class="sc-card-s" id="w-ok" style="margin-top:6px"></div>';
    }
    v.innerHTML=h3;
    if(backTab==="talkwithme"){
      $("sess-save").onclick=function(){var n=$("sess-note").value.trim();if(!n)return;if(!saved.sessions[d.id])saved.sessions[d.id]=[];saved.sessions[d.id].push({d:todayKey(),n:n});saved.done[d.id]=1;save();openItem(id);};
    }else{
      $("w-save").onclick=function(){saved.notes[d.id]=$("w-note").value;saved.done[d.id]=1;save();$("w-ok").textContent="Saved on this device ✓";};
    }
    bindBack();return;
  }
  if(d.kind==="style"){
    var h4='<button class="sc-back" data-go="styles">&larr; Back to Styles</button>';
    h4+='<span class="sc-tag">Style trio</span><div class="sc-card-t" style="font-size:19px;margin:8px 0">'+esc(d.t)+'</div>';
    h4+='<div class="sc-sec">💼 Work version</div><div class="sc-story">'+esc(d.formal)+'</div>';
    h4+='<div class="sc-sec">😊 Friendly professional</div><div class="sc-story">'+esc(d.friendly)+'</div>';
    h4+='<div class="sc-sec">💬 Casual</div><div class="sc-story">'+esc(d.casual)+'</div>';
    h4+='<div class="sc-take"><b>When to use which:</b> '+esc(d.note)+'</div>';
    h4+='<div class="sc-sec">Your turn — create</div><div class="sc-take">Pick a real situation from YOUR week. Write it three ways: work, friendly, casual. Then say all three out loud and feel the difference.</div>';
    var done4=!!saved.done[d.id];
    h4+='<button class="sc-btn '+(done4?"sc-btn2":"")+'" id="done-btn" style="margin-top:14px">'+(done4?"Done ✓ — tap to undo":"Mark done")+'</button>';
    v.innerHTML=h4;
    $("done-btn").onclick=function(){if(saved.done[d.id])delete saved.done[d.id];else saved.done[d.id]=1;save();openItem(id);};
    bindBack();return;
  }
  if(d.kind==="book"){
    var h5='<button class="sc-back" data-go="books">&larr; Back to Books</button>';
    h5+='<span class="sc-tag">Source</span><div class="sc-card-t" style="font-size:19px;margin:8px 0">'+esc(d.t)+'</div>';
    h5+='<div class="sc-card-s" style="margin-bottom:8px">'+esc(d.by||"")+'</div>';
    h5+='<div class="sc-story">'+esc(d.about)+'</div>';
    (d.takeaways||[]).forEach(function(tw){
      h5+='<div class="sc-sec">'+esc(tw.t)+'</div><div class="sc-story">'+esc(tw.d)+'</div>';
      h5+='<div class="sc-take"><b>Try it:</b> '+esc(tw.try)+'</div>';
    });
    if(d.feeds&&d.feeds.length){h5+='<div class="sc-sec">Feeds these tabs</div><div class="sc-story">'+d.feeds.map(function(f){return esc(f);}).join(" · ")+'</div>';}
    h5+=planHTML(d);
    var done5=!!saved.done[d.id];
    h5+='<button class="sc-btn '+(done5?"sc-btn2":"")+'" id="done-btn" style="margin-top:14px">'+(done5?"Done ✓ — tap to undo":"Mark done")+'</button>';
    v.innerHTML=h5;
    $("done-btn").onclick=function(){if(saved.done[d.id])delete saved.done[d.id];else saved.done[d.id]=1;save();openItem(id);};
    bindBack();bindCards();return;
  }
}

/* ---------- reading plans (books) ---------- */
function planHTML(d){
  var practices=d.plan||[];
  function pracCard(pid){
    var it=byId(pid);if(!it)return "";
    return '<div class="sc-card" data-open="'+it.id+'"><span class="sc-tag">Practice · '+esc(kindLabel(it))+'</span><div class="sc-card-t" style="font-size:15px">'+esc(it.t)+'</div><div class="sc-card-s">Tap to open the practice</div></div>';
  }
  function pracFor(i){return practices.length?practices[i%practices.length]:null;}
  var h="";
  if(d.pages){
    var days=Math.ceil(d.pages/5);
    h+='<div class="sc-sec">Reading plan: 5 pages a day</div>';
    h+='<div class="sc-story">'+d.pages+' pages, 5 a day = '+days+' days. Each day: read your 5 pages, then do the practice. Page counts are close but not exact — adjust as you go.</div>';
    h+='<div class="sc-plan">';
    for(var n=1;n<=days;n++){
      var a=(n-1)*5+1,b=Math.min(n*5,d.pages);
      h+='<div class="sc-planrow"><div class="sc-planday"><b>Day '+n+'</b><span>Pages '+a+'–'+b+'</span></div>'+pracCard(pracFor(n-1))+'</div>';
    }
    h+='</div>';
  }else if(d.themes&&d.themes.length){
    h+='<div class="sc-sec">Reading plan: one theme a day</div>';
    h+='<div class="sc-story">One theme a day, then the practice. (Reading 5 pages a day from the book pairs perfectly with this too.)</div>';
    h+='<div class="sc-plan">';
    d.themes.forEach(function(t,i){
      h+='<div class="sc-planrow"><div class="sc-planday"><b>Day '+(i+1)+'</b><span>'+esc(t)+'</span></div>'+pracCard(pracFor(i))+'</div>';
    });
    h+='</div>';
  }
  return h;
}

/* ---------- tab renderers ---------- */
function render(tab){
  var v=$("view");
  document.querySelectorAll(".sc-tab").forEach(function(b){b.classList.toggle("active",b.getAttribute("data-tab")===tab);});
  if(tab==="today"){renderToday(v);return;}
  var h='<div class="sc-intro">'+esc(INTRO[tab])+'</div>';
  h+=tabMeta(tab);
  h+=cardList(inTab(tab));
  v.innerHTML=h;bindCards();
}

function renderToday(v){
  var key=todayKey(),seed=0;
  for(var i=0;i<key.length;i++)seed=(seed*31+key.charCodeAt(i))|0;
  var rnd=seededRand(seed);
  var warm=spick(rnd,lessonsIn("pronounce"),1)[0];
  var techTabs=["speakup","present","boundaries","persuade","thinkfast","grammar"];
  var pool=[];techTabs.forEach(function(t){lessonsIn(t).forEach(function(l){pool.push(l);});});
  var lesson=spick(rnd,pool,1)[0];
  var qpool=[];DATA.forEach(function(d){(d.quiz||[]).forEach(function(q){qpool.push({q:q,from:d.t});});});
  var qq=spick(rnd,qpool,1)[0];
  var talk=spick(rnd,inTab("talkwithme").filter(function(d){return d.kind==="prompt";}),1)[0];
  var doneDaily=!!(saved.daily&&saved.daily[key]);
  var h='<div class="sc-card" style="cursor:default"><span class="sc-tag">Daily warm-up</span><div class="sc-card-t">Today\'s session</div><div class="sc-card-s">Four small steps. About 10 minutes. A new set every day.</div></div>';
  function stepCard(n,tag,title,sub,id){
    return '<div class="sc-card" data-open="'+id+'"><span class="sc-tag">Step '+n+' · '+esc(tag)+'</span><div class="sc-card-t">'+esc(title)+'</div><div class="sc-card-s">'+esc(sub)+'</div></div>';
  }
  if(warm)h+=stepCard(1,"Warm up",warm.t,"Loosen your mouth and voice.",warm.id);
  if(lesson)h+=stepCard(2,"Lesson",lesson.t,lesson.tech.split(".")[0]+".",lesson.id);
  if(qq)h+='<div class="sc-card" style="cursor:default"><span class="sc-tag">Step 3 · Quick check</span><div class="sc-card-t" style="font-size:15px">'+esc(qq.q.q)+'</div><div class="sc-card-s">From: '+esc(qq.from)+' — open the lesson to answer.</div></div>';
  if(talk)h+=stepCard(4,"Speak",talk.t,talk.prompt.split(".")[0]+".",talk.id);
  h+='<button class="sc-btn '+(doneDaily?"sc-btn2":"")+'" id="d-done" style="margin-top:6px">'+(doneDaily?"Today's session done ✓":"Mark today's session done")+'</button>';
  h+='<div class="sc-meta" style="margin-top:14px"><span>Your learning HQ</span></div><div id="d-links"></div>';
  h+='<div class="sc-card" style="cursor:default;margin-top:14px"><span class="sc-tag">iPad tip</span><div class="sc-card-t">Full screen &amp; offline</div><div class="sc-card-s">Save this page to your Files app (Library &#8594; speaking-coach &#8594; Share &#8594; Save to Files) and open it anytime — no internet needed. Your progress stays saved on this device.</div></div>';
  v.innerHTML=h;bindCards();
  $("d-done").onclick=function(){if(!saved.daily)saved.daily={};if(saved.daily[key])delete saved.daily[key];else saved.daily[key]=1;save();renderToday(v);};
  var links=$("d-links"),lh="";
  TABS.slice(1).forEach(function(t){
    var n=doneCount(t[0]),total=inTab(t[0]).length;
    lh+='<div class="sc-card" data-goto="'+t[0]+'"><div class="sc-card-t" style="font-size:15px">'+esc(t[1])+'</div><div class="sc-card-s">'+n+' of '+total+' done — '+esc(INTRO[t[0]])+'</div></div>';
  });
  links.innerHTML=lh;
  links.querySelectorAll("[data-goto]").forEach(function(c){c.onclick=function(){render(c.getAttribute("data-goto"));};});
}

/* ---------- boot ---------- */
function boot(){
  var tabs=$("tabs"),h="";
  TABS.forEach(function(t,i){h+='<button class="sc-tab'+(i===0?" active":"")+'" data-tab="'+t[0]+'">'+esc(t[1])+'</button>';});
  tabs.innerHTML=h;
  tabs.querySelectorAll(".sc-tab").forEach(function(b){b.onclick=function(){render(b.getAttribute("data-tab"));} ;});
  render("today");
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
})();

</script>
</body>
</html>
